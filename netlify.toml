[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[build.processing]
  skip_processing = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = false

[functions]
  node_bundler = "esbuild"
